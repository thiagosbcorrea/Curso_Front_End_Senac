        <section class="container section-padding">

    <div id="carouselCafe" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="img/galeria8.png" class="d-block w-100 rounded" alt="Capuccino">
                <p class="text-center mt-2">Capuccino</p>
            </div>

            <div class="carousel-item">
                <img src="img/galeria9.png" class="d-block w-100 rounded" alt="Machiatto">

            </div>

            <div class="carousel-item">
                <img src="img/galeria10.png" class="d-block w-100 rounded" alt="Croassaint">

        </div>
